<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 683" role="img" aria-labelledby="dcd8d18e7"><title id="dcd8d18e7">From the grid number to the IT number on a converted mining site: 100 MW at the fence, about 80 MW after the cooling plant and the losses, about 65 MW of IT after redundancy</title><defs><pattern id="d81c04045-h" patternUnits="userSpaceOnUse" width="10.19" height="10.19" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="10.19" stroke="rgba(107,101,92,0.45)" stroke-width="0.85"/></pattern></defs><g data-system="plate" style="--d:0ms"><text x="88.35" y="44.17" font-family="'JetBrains Mono', monospace" style="font-family:var(--font-mono,'JetBrains Mono'),monospace" font-size="19.54" font-weight="400" fill="#9E4522" text-anchor="start" letter-spacing="2.74">FIGURE 04 / THE GRID NUMBER AND THE IT NUMBER</text><text x="1311.65" y="44.17" font-family="'JetBrains Mono', monospace" style="font-family:var(--font-mono,'JetBrains Mono'),monospace" font-size="19.54" font-weight="400" fill="#6B655C" text-anchor="end" letter-spacing="2.74">A CONVERTED MINING SITE, TYPICAL</text><line x1="88.35" y1="62.86" x2="1311.65" y2="62.86" stroke="#D9D3C8" stroke-width="0.85" fill="none" stroke-linecap="round" stroke-linejoin="round" pathLength="1" data-draw="1"/><line x1="88.35" y1="616.74" x2="1311.65" y2="616.74" stroke="#D9D3C8" stroke-width="0.85" fill="none" stroke-linecap="round" stroke-linejoin="round" pathLength="1" data-draw="1"/><text x="88.35" y="652.42" font-family="'Schibsted Grotesk', sans-serif" style="font-family:var(--font-display,'Schibsted Grotesk'),sans-serif" font-size="22.09" font-weight="700" fill="#171614" text-anchor="start">Abdelilah Sidqui</text><text x="1311.65" y="652.42" font-family="'JetBrains Mono', monospace" style="font-family:var(--font-mono,'JetBrains Mono'),monospace" font-size="19.54" font-weight="400" fill="#6B655C" text-anchor="end" letter-spacing="2.74">SIDQUI.COM · DRAWING</text></g><g data-system="bar-1" style="--d:300ms"><text x="88.35" y="137.60999999999999" font-family="'JetBrains Mono', monospace" style="font-family:var(--font-mono,'JetBrains Mono'),monospace" font-size="16.99" font-weight="400" fill="#6B655C" text-anchor="start" letter-spacing="2.38">01</text><text x="132.51999999999998" y="137.60999999999999" font-family="'Schibsted Grotesk', sans-serif" style="font-family:var(--font-display,'Schibsted Grotesk'),sans-serif" font-size="21.24" font-weight="700" fill="#171614" text-anchor="start">At the fence</text><text x="132.51999999999998" y="169.89" font-family="'Inter', sans-serif" style="font-family:var(--font-body,'Inter'),sans-serif" font-size="17.84" font-weight="400" fill="#6B655C" text-anchor="start">The grid connection: the number</text><text x="132.51999999999998" y="191.98" font-family="'Inter', sans-serif" style="font-family:var(--font-body,'Inter'),sans-serif" font-size="17.84" font-weight="400" fill="#6B655C" text-anchor="start">in the announcement and the price</text><rect x="638.84" y="141.01" width="672.82" height="44.17" fill="#F2EFE9"/><rect x="638.84" y="141.01" width="672.82" height="44.17" stroke="#D9D3C8" stroke-width="1.7" fill="none" stroke-linecap="round" stroke-linejoin="round" pathLength="1" data-draw="1"/><text x="1298.06" y="169.89" font-family="'Schibsted Grotesk', sans-serif" style="font-family:var(--font-display,'Schibsted Grotesk'),sans-serif" font-size="18.69" font-weight="700" fill="#171614" text-anchor="end">100 MW</text></g><g data-system="bar-2" style="--d:800ms"><text x="88.35" y="280.33" font-family="'JetBrains Mono', monospace" style="font-family:var(--font-mono,'JetBrains Mono'),monospace" font-size="16.99" font-weight="400" fill="#6B655C" text-anchor="start" letter-spacing="2.38">02</text><text x="132.51999999999998" y="280.33" font-family="'Schibsted Grotesk', sans-serif" style="font-family:var(--font-display,'Schibsted Grotesk'),sans-serif" font-size="21.24" font-weight="700" fill="#171614" text-anchor="start">After the cooling plant and losses</text><text x="132.51999999999998" y="312.61" font-family="'Inter', sans-serif" style="font-family:var(--font-body,'Inter'),sans-serif" font-size="17.84" font-weight="400" fill="#6B655C" text-anchor="start">Chillers, pumps, fans, dry coolers and</text><text x="132.51999999999998" y="334.7" font-family="'Inter', sans-serif" style="font-family:var(--font-body,'Inter'),sans-serif" font-size="17.84" font-weight="400" fill="#6B655C" text-anchor="start">the losses in distribution take a share</text><rect x="1177.09" y="283.73" width="134.56" height="44.17" fill="url(#d81c04045-h)"/><rect x="638.84" y="283.73" width="538.25" height="44.17" fill="#F2EFE9"/><rect x="638.84" y="283.73" width="672.82" height="44.17" stroke="#D9D3C8" stroke-width="1.7" fill="none" stroke-linecap="round" stroke-linejoin="round" pathLength="1" data-draw="1"/><text x="1163.5" y="312.61" font-family="'Schibsted Grotesk', sans-serif" style="font-family:var(--font-display,'Schibsted Grotesk'),sans-serif" font-size="18.69" font-weight="700" fill="#171614" text-anchor="end">about 80 MW</text></g><g data-system="bar-3" style="--d:1300ms"><text x="88.35" y="423.04999999999995" font-family="'JetBrains Mono', monospace" style="font-family:var(--font-mono,'JetBrains Mono'),monospace" font-size="16.99" font-weight="400" fill="#6B655C" text-anchor="start" letter-spacing="2.38">03</text><text x="132.51999999999998" y="423.04999999999995" font-family="'Schibsted Grotesk', sans-serif" style="font-family:var(--font-display,'Schibsted Grotesk'),sans-serif" font-size="21.24" font-weight="700" fill="#171614" text-anchor="start">After redundancy</text><text x="132.51999999999998" y="455.33000000000004" font-family="'Inter', sans-serif" style="font-family:var(--font-body,'Inter'),sans-serif" font-size="17.84" font-weight="400" fill="#6B655C" text-anchor="start">The lines carry each other’s load,</text><text x="132.51999999999998" y="477.41999999999996" font-family="'Inter', sans-serif" style="font-family:var(--font-body,'Inter'),sans-serif" font-size="17.84" font-weight="400" fill="#6B655C" text-anchor="start">so a share of their rating is held back</text><rect x="1076.17" y="426.45000000000005" width="235.49" height="44.17" fill="url(#d81c04045-h)"/><rect x="638.84" y="426.45000000000005" width="437.33" height="44.17" fill="#9E4522"/><rect x="638.84" y="426.45000000000005" width="672.82" height="44.17" stroke="#D9D3C8" stroke-width="1.7" fill="none" stroke-linecap="round" stroke-linejoin="round" pathLength="1" data-draw="1"/><text x="1062.5800000000002" y="455.33000000000004" font-family="'Schibsted Grotesk', sans-serif" style="font-family:var(--font-display,'Schibsted Grotesk'),sans-serif" font-size="18.69" font-weight="700" fill="#FAF8F4" text-anchor="end">about 65 MW of IT</text></g><g data-system="note" style="--d:1900ms"><line x1="88.35" y1="535.1899999999999" x2="1311.6499999999999" y2="535.1899999999999" stroke="#D9D3C8" stroke-width="0.85" fill="none" stroke-linecap="round" stroke-linejoin="round" pathLength="1" data-draw="1"/><text x="88.35" y="569.17" font-family="'Inter', sans-serif" style="font-family:var(--font-body,'Inter'),sans-serif" font-size="17.84" font-weight="400" fill="#6B655C" text-anchor="start">Galaxy’s first phase at Helios, Texas, July 2026: 133 MW of IT delivered from about 200 MW of gross site power.</text></g></svg>