<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 717" role="img" aria-labelledby="db1209c6e"><title id="db1209c6e">A liquid-cooled hall's two loops and the three ways its heat can leave: dry cooler, evaporative tower and chiller, with what each spends and which carries the Gulf summer peak</title><defs><pattern id="d0d274b03-h" patternUnits="userSpaceOnUse" width="11.89" height="11.89" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="11.89" stroke="rgba(107,101,92,0.45)" stroke-width="0.85"/></pattern></defs><g data-system="plate" style="--d:0ms"><text x="88.35" y="44.17" font-family="'JetBrains Mono', monospace" style="font-family:var(--font-mono,'JetBrains Mono'),monospace" font-size="19.54" font-weight="400" fill="#9E4522" text-anchor="start" letter-spacing="2.74">FIGURE 01 / TWO LOOPS, THREE WAYS OUT</text><text x="1311.65" y="44.17" font-family="'JetBrains Mono', monospace" style="font-family:var(--font-mono,'JetBrains Mono'),monospace" font-size="19.54" font-weight="400" fill="#6B655C" text-anchor="end" letter-spacing="2.74">A LIQUID-COOLED HALL IN THE GULF</text><line x1="88.35" y1="62.86" x2="1311.65" y2="62.86" stroke="#D9D3C8" stroke-width="0.85" fill="none" stroke-linecap="round" stroke-linejoin="round" pathLength="1" data-draw="1"/><line x1="88.35" y1="650.74" x2="1311.65" y2="650.74" stroke="#D9D3C8" stroke-width="0.85" fill="none" stroke-linecap="round" stroke-linejoin="round" pathLength="1" data-draw="1"/><text x="88.35" y="686.42" font-family="'Schibsted Grotesk', sans-serif" style="font-family:var(--font-display,'Schibsted Grotesk'),sans-serif" font-size="22.09" font-weight="700" fill="#171614" text-anchor="start">Abdelilah Sidqui</text><text x="1311.65" y="686.42" font-family="'JetBrains Mono', monospace" style="font-family:var(--font-mono,'JetBrains Mono'),monospace" font-size="19.54" font-weight="400" fill="#6B655C" text-anchor="end" letter-spacing="2.74">SIDQUI.COM · DRAWING</text></g><g data-system="hall" style="--d:300ms"><text x="88.35" y="110.42999999999999" font-family="'JetBrains Mono', monospace" style="font-family:var(--font-mono,'JetBrains Mono'),monospace" font-size="16.99" font-weight="400" fill="#6B655C" text-anchor="start" letter-spacing="2.38">THE HALL</text><rect x="88.35" y="130.82" width="333.01" height="132.52" fill="#FFFFFF"/><rect x="88.35" y="130.82" width="333.01" height="132.52" stroke="#D9D3C8" stroke-width="1.7" fill="none" stroke-linecap="round" stroke-linejoin="round" pathLength="1" data-draw="1"/><rect x="88.35" y="130.82" width="3.74" height="132.52" fill="#9E4522"/><text x="108.74" y="163.1" font-family="'Schibsted Grotesk', sans-serif" style="font-family:var(--font-display,'Schibsted Grotesk'),sans-serif" font-size="21.24" font-weight="700" fill="#171614" text-anchor="start">Cold plates</text><text x="108.74" y="188.59" font-family="'Inter', sans-serif" style="font-family:var(--font-body,'Inter'),sans-serif" font-size="17.84" font-weight="400" fill="#6B655C" text-anchor="start">Processors and accelerators,</text><text x="108.74" y="210.67" font-family="'Inter', sans-serif" style="font-family:var(--font-body,'Inter'),sans-serif" font-size="17.84" font-weight="400" fill="#6B655C" text-anchor="start">warm coolant, little mass.</text><rect x="88.35" y="304.12" width="333.01" height="132.52" fill="#F2EFE9"/><rect x="88.35" y="304.12" width="333.01" height="132.52" stroke="#D9D3C8" stroke-width="1.7" fill="none" stroke-linecap="round" stroke-linejoin="round" pathLength="1" data-draw="1"/><rect x="88.35" y="304.12" width="3.74" height="132.52" fill="#D9D3C8"/><text x="108.74" y="336.4" font-family="'Schibsted Grotesk', sans-serif" style="font-family:var(--font-display,'Schibsted Grotesk'),sans-serif" font-size="21.24" font-weight="700" fill="#171614" text-anchor="start">Air-cooled share</text><text x="108.74" y="361.89" font-family="'Inter', sans-serif" style="font-family:var(--font-body,'Inter'),sans-serif" font-size="17.84" font-weight="400" fill="#6B655C" text-anchor="start">Memory, drives, power supplies,</text><text x="108.74" y="383.97" font-family="'Inter', sans-serif" style="font-family:var(--font-body,'Inter'),sans-serif" font-size="17.84" font-weight="400" fill="#6B655C" text-anchor="start">switches, storage, network.</text></g><g data-system="loops" style="--d:800ms"><text x="472.33000000000004" y="110.42999999999999" font-family="'JetBrains Mono', monospace" style="font-family:var(--font-mono,'JetBrains Mono'),monospace" font-size="16.99" font-weight="400" fill="#6B655C" text-anchor="start" letter-spacing="2.38">TWO LOOPS</text><rect x="496.12" y="130.82" width="271.84" height="132.52" fill="#FFFFFF"/><rect x="496.12" y="130.82" width="271.84" height="132.52" stroke="#D9D3C8" stroke-width="1.7" fill="none" stroke-linecap="round" stroke-linejoin="round" pathLength="1" data-draw="1"/><rect x="496.12" y="130.82" width="3.74" height="132.52" fill="#9E4522"/><text x="516.51" y="163.1" font-family="'Schibsted Grotesk', sans-serif" style="font-family:var(--font-display,'Schibsted Grotesk'),sans-serif" font-size="21.24" font-weight="700" fill="#171614" text-anchor="start">CDU, warm loop</text><text x="516.51" y="188.59" font-family="'Inter', sans-serif" style="font-family:var(--font-body,'Inter'),sans-serif" font-size="17.84" font-weight="400" fill="#6B655C" text-anchor="start">Warm facility water;</text><text x="516.51" y="210.67" font-family="'Inter', sans-serif" style="font-family:var(--font-body,'Inter'),sans-serif" font-size="17.84" font-weight="400" fill="#6B655C" text-anchor="start">more free-cooling hours.</text><rect x="496.12" y="304.12" width="271.84" height="132.52" fill="#FFFFFF"/><rect x="496.12" y="304.12" width="271.84" height="132.52" stroke="#D9D3C8" stroke-width="1.7" fill="none" stroke-linecap="round" stroke-linejoin="round" pathLength="1" data-draw="1"/><rect x="496.12" y="304.12" width="3.74" height="132.52" fill="#9E4522"/><text x="516.51" y="336.4" font-family="'Schibsted Grotesk', sans-serif" style="font-family:var(--font-display,'Schibsted Grotesk'),sans-serif" font-size="21.24" font-weight="700" fill="#171614" text-anchor="start">CRAH, chilled loop</text><text x="516.51" y="361.89" font-family="'Inter', sans-serif" style="font-family:var(--font-body,'Inter'),sans-serif" font-size="17.84" font-weight="400" fill="#6B655C" text-anchor="start">Coil water below the air</text><text x="516.51" y="383.97" font-family="'Inter', sans-serif" style="font-family:var(--font-body,'Inter'),sans-serif" font-size="17.84" font-weight="400" fill="#6B655C" text-anchor="start">it makes: compressors.</text><line x1="421.36" y1="197.07999999999998" x2="487.62" y2="197.07999999999998" stroke="#171614" stroke-width="3.74" fill="none" stroke-linecap="round" stroke-linejoin="round" pathLength="1" data-draw="1"/><polygon points="487.62,197.07999999999998 475.38,191.725 475.38,202.43499999999997" fill="#171614"/><line x1="421.36" y1="370.38" x2="487.62" y2="370.38" stroke="#171614" stroke-width="3.74" fill="none" stroke-linecap="round" stroke-linejoin="round" pathLength="1" data-draw="1"/><polygon points="487.62,370.38 475.38,365.025 475.38,375.735" fill="#171614"/></g><g data-system="rejection" style="--d:1400ms"><text x="825.73" y="110.42999999999999" font-family="'JetBrains Mono', monospace" style="font-family:var(--font-mono,'JetBrains Mono'),monospace" font-size="16.99" font-weight="400" fill="#6B655C" text-anchor="start" letter-spacing="2.38">THREE WAYS OUT</text><line x1="795.15" y1="197.07999999999998" x2="795.15" y2="441.74" stroke="#171614" stroke-width="3.74" fill="none" stroke-linecap="round" stroke-linejoin="round" pathLength="1" data-draw="1"/><line x1="767.96" y1="197.07999999999998" x2="795.15" y2="197.07999999999998" stroke="#171614" stroke-width="3.74" fill="none" stroke-linecap="round" stroke-linejoin="round" pathLength="1" data-draw="1"/><line x1="767.96" y1="370.38" x2="784.95" y2="370.38" stroke="#171614" stroke-width="3.74" fill="none" stroke-linecap="round" stroke-linejoin="round" pathLength="1" data-draw="1"/><line x1="784.95" y1="370.38" x2="784.95" y2="441.74" stroke="#171614" stroke-width="3.74" fill="none" stroke-linecap="round" stroke-linejoin="round" pathLength="1" data-draw="1"/><line x1="784.95" y1="441.74" x2="817.23" y2="441.74" stroke="#171614" stroke-width="3.74" fill="none" stroke-linecap="round" stroke-linejoin="round" pathLength="1" data-draw="1"/><line x1="795.15" y1="183.49" x2="817.23" y2="183.49" stroke="#171614" stroke-width="3.74" fill="none" stroke-linecap="round" stroke-linejoin="round" pathLength="1" data-draw="1"/><polygon points="817.23,183.49 804.99,178.13500000000002 804.99,188.845" fill="#171614"/><rect x="825.73" y="130.82" width="485.92" height="105.34" fill="#F2EFE9"/><rect x="825.73" y="130.82" width="485.92" height="105.34" stroke="#D9D3C8" stroke-width="1.7" fill="none" stroke-linecap="round" stroke-linejoin="round" pathLength="1" data-draw="1"/><rect x="825.73" y="130.82" width="3.74" height="105.34" fill="#D9D3C8"/><text x="846.12" y="161.39999999999998" font-family="'Schibsted Grotesk', sans-serif" style="font-family:var(--font-display,'Schibsted Grotesk'),sans-serif" font-size="21.24" font-weight="700" fill="#171614" text-anchor="start">Dry cooler</text><text x="846.12" y="186.89" font-family="'Inter', sans-serif" style="font-family:var(--font-body,'Inter'),sans-serif" font-size="17.84" font-weight="400" fill="#6B655C" text-anchor="start">Limited by the dry-bulb: water</text><text x="846.12" y="208.98" font-family="'Inter', sans-serif" style="font-family:var(--font-body,'Inter'),sans-serif" font-size="17.84" font-weight="400" fill="#6B655C" text-anchor="start">cannot leave cooler than the air.</text><text x="1291.2599999999998" y="161.39999999999998" font-family="'JetBrains Mono', monospace" style="font-family:var(--font-mono,'JetBrains Mono'),monospace" font-size="16.14" font-weight="400" fill="#9E4522" text-anchor="end" letter-spacing="1.29">SPENDS FAN POWER</text><rect x="829.13" y="134.20999999999998" width="479.13" height="98.54" fill="url(#d0d274b03-h)"/><line x1="795.15" y1="312.61" x2="817.23" y2="312.61" stroke="#171614" stroke-width="3.74" fill="none" stroke-linecap="round" stroke-linejoin="round" pathLength="1" data-draw="1"/><polygon points="817.23,312.61 804.99,307.255 804.99,317.96500000000003" fill="#171614"/><rect x="825.73" y="259.94" width="485.92" height="105.34" fill="#FFFFFF"/><rect x="825.73" y="259.94" width="485.92" height="105.34" stroke="#D9D3C8" stroke-width="1.7" fill="none" stroke-linecap="round" stroke-linejoin="round" pathLength="1" data-draw="1"/><rect x="825.73" y="259.94" width="3.74" height="105.34" fill="#9E4522"/><text x="846.12" y="290.52" font-family="'Schibsted Grotesk', sans-serif" style="font-family:var(--font-display,'Schibsted Grotesk'),sans-serif" font-size="21.24" font-weight="700" fill="#171614" text-anchor="start">Evaporative tower</text><text x="846.12" y="316.01" font-family="'Inter', sans-serif" style="font-family:var(--font-body,'Inter'),sans-serif" font-size="17.84" font-weight="400" fill="#6B655C" text-anchor="start">Nears the wet-bulb, never reaches</text><text x="846.12" y="338.1" font-family="'Inter', sans-serif" style="font-family:var(--font-body,'Inter'),sans-serif" font-size="17.84" font-weight="400" fill="#6B655C" text-anchor="start">it. About 1,500 L/h per MW.</text><text x="1291.2599999999998" y="290.53" font-family="'JetBrains Mono', monospace" style="font-family:var(--font-mono,'JetBrains Mono'),monospace" font-size="16.14" font-weight="400" fill="#9E4522" text-anchor="end" letter-spacing="1.29">SPENDS WATER</text><polygon points="817.23,441.74 804.99,436.385 804.99,447.095" fill="#171614"/><rect x="825.73" y="389.06999999999994" width="485.92" height="105.34" fill="#FFFFFF"/><rect x="825.73" y="389.06999999999994" width="485.92" height="105.34" stroke="#D9D3C8" stroke-width="1.7" fill="none" stroke-linecap="round" stroke-linejoin="round" pathLength="1" data-draw="1"/><rect x="825.73" y="389.06999999999994" width="3.74" height="105.34" fill="#9E4522"/><text x="846.12" y="419.6499999999999" font-family="'Schibsted Grotesk', sans-serif" style="font-family:var(--font-display,'Schibsted Grotesk'),sans-serif" font-size="21.24" font-weight="700" fill="#171614" text-anchor="start">Chiller</text><text x="846.12" y="445.13999999999993" font-family="'Inter', sans-serif" style="font-family:var(--font-body,'Inter'),sans-serif" font-size="17.84" font-weight="400" fill="#6B655C" text-anchor="start">Compressors sized for the hottest</text><text x="846.12" y="467.2299999999999" font-family="'Inter', sans-serif" style="font-family:var(--font-body,'Inter'),sans-serif" font-size="17.84" font-weight="400" fill="#6B655C" text-anchor="start">hour, and the power behind them.</text><text x="1291.2599999999998" y="419.65" font-family="'JetBrains Mono', monospace" style="font-family:var(--font-mono,'JetBrains Mono'),monospace" font-size="16.14" font-weight="400" fill="#9E4522" text-anchor="end" letter-spacing="1.29">SPENDS POWER</text></g><g data-system="peak" style="--d:2000ms"><line x1="825.73" y1="524.99" x2="1311.6499999999999" y2="524.99" stroke="#D9D3C8" stroke-width="0.85" fill="none" stroke-linecap="round" stroke-linejoin="round" pathLength="1" data-draw="1"/><text x="825.73" y="552.18" font-family="'JetBrains Mono', monospace" style="font-family:var(--font-mono,'JetBrains Mono'),monospace" font-size="16.99" font-weight="400" fill="#6B655C" text-anchor="start" letter-spacing="2.38">GULF SUMMER PEAK</text><text x="825.73" y="579.36" font-family="'Inter', sans-serif" style="font-family:var(--font-body,'Inter'),sans-serif" font-size="17.84" font-weight="400" fill="#6B655C" text-anchor="start">Dry-bulb above 45 °C, wet-bulb above 30 °C.</text><text x="825.73" y="601.45" font-family="'Inter', sans-serif" style="font-family:var(--font-body,'Inter'),sans-serif" font-size="17.84" font-weight="400" fill="#6B655C" text-anchor="start">The dry cooler is out. The tower spends</text><text x="825.73" y="623.54" font-family="'Inter', sans-serif" style="font-family:var(--font-body,'Inter'),sans-serif" font-size="17.84" font-weight="400" fill="#6B655C" text-anchor="start">water, the chiller spends power.</text></g><g data-system="note" style="--d:2400ms"><text x="88.35" y="511.4" font-family="'Inter', sans-serif" style="font-family:var(--font-body,'Inter'),sans-serif" font-size="17.84" font-weight="400" fill="#6B655C" text-anchor="start">Free-cooling hours rise with the water temperature the IT</text><text x="88.35" y="534.34" font-family="'Inter', sans-serif" style="font-family:var(--font-body,'Inter'),sans-serif" font-size="17.84" font-weight="400" fill="#6B655C" text-anchor="start">vendor allows, and fall to zero while the dry-bulb sits above</text><text x="88.35" y="557.27" font-family="'Inter', sans-serif" style="font-family:var(--font-body,'Inter'),sans-serif" font-size="17.84" font-weight="400" fill="#6B655C" text-anchor="start">the loop. The chilled loop runs on compressors all summer.</text></g></svg>