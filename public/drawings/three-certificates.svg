ins Mono'),monospace" font-size="15.29" font-weight="400" fill="#9E4522" text-anchor="start" letter-spacing="1.53">TIER CERTIFICATION 01</text><text x="108.74" y="314.31" font-family="'Schibsted Grotesk', sans-serif" style="font-family:var(--font-display,'Schibsted Grotesk'),sans-serif" font-size="20.39" font-weight="700" fill="#171614" text-anchor="start">Design Documents</text><text x="108.74" y="344.89" font-family="'Inter', sans-serif" style="font-family:var(--font-body,'Inter'),sans-serif" font-size="16.99" font-weight="400" fill="#171614" text-anchor="start">Proves the drawings would meet</text><text x="108.74" y="366.98" font-family="'Inter', sans-serif" style="font-family:var(--font-body,'Inter'),sans-serif" font-size="16.99" font-weight="400" fill="#171614" text-anchor="start">Tier III if built as drawn.</text><text x="108.74" y="395.87" font-family="'Inter', sans-serif" style="font-family:var(--font-body,'Inter'),sans-serif" font-size="16.99" font-weight="400" fill="#6B655C" text-anchor="start">Not what was built, nor</text><text x="108.74" y="417.95000000000005" font-family="'Inter', sans-serif" style="font-family:var(--font-body,'Inter'),sans-serif" font-size="16.99" font-weight="400" fill="#6B655C" text-anchor="start">how the controls behave.</text><circle cx="700.0" cy="208.97" r="10.19" fill="#9E4522"/><line x1="700.0" y1="219.17" x2="700.0" y2="253.15" stroke="#9E4522" stroke-width="2.21" fill="none" stroke-linecap="round" stroke-linejoin="round" pathLength="1" data-draw="1"/><rect x="518.2" y="253.15" width="363.59" height="186.89" fill="#FFFFFF"/><rect x="518.2" y="253.15" width="363.59" height="186.89" stroke="#D9D3C8" stroke-width="1.7" fill="none" stroke-linecap="round" stroke-linejoin="round" pathLength="1" data-draw="1"/><rect x="518.2" y="253.15" width="3.74" height="186.89" fill="#9E4522"/><text x="538.59" y="283.73" font-family="'JetBrains Mono', monospace" style="font-family:var(--font-mono,'JetBrains Mono'),monospace" font-size="15.29" fo